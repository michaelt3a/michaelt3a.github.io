<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Poke IQ - Pokeworks</title>
  <meta name="description" content="Quick trivia about Pokeworks, its menu, and its ingredients." />
  <link rel="stylesheet" href="styles.css?v=25" />
  <link rel="stylesheet" href="poke-iq.css?v=1" />
  <link rel="stylesheet" href="theme.css?v=8" />
  <meta name="theme-color" content="#0a1010" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <script src="theme.js?v=7"></script>
  <script src="sound.js?v=4"></script>
  <script src="streak.js?v=2"></script>
</head>
<body>
  <a href="index.html" class="back-link">← Minigames</a>

  <div class="game-shell page-content">
    <header class="hud">
      <div class="hud-left">
        <img src="pokeworks-logo-circle-1.png" alt="Pokeworks" class="logo" />
      </div>
      <div class="hud-right">
        <div class="score">
          <span class="score-label">Best</span>
          <span id="high-score" class="score-value">0</span>
        </div>
        <div class="score">
          <span class="score-label">Score</span>
          <span id="score" class="score-value">0</span>
        </div>
      </div>
    </header>

    <main class="stage iq-stage">
      <div class="iq-play" id="iq-play" hidden>
        <div class="iq-timer"><i id="iq-timer-fill"></i></div>
        <p class="iq-progress" id="iq-progress">1 / 10</p>
        <p class="iq-question" id="iq-question"></p>
        <div class="iq-answers" id="iq-answers"></div>
        <p class="iq-feedback" id="iq-feedback">&nbsp;</p>
      </div>

      <div id="overlay" class="overlay">
        <div id="screen-start" class="overlay-panel">
          <h1 class="overlay-title" id="start-title">Poke IQ</h1>
          <p class="overlay-subtitle" id="start-subtitle">
            10 quick questions about Pokeworks and its menu.
            10 seconds each, and faster answers score more.
          </p>
          <button id="start-btn" class="btn" type="button">Start</button>
        </div>

        <div id="screen-gameover" class="overlay-panel hidden">
          <h1 class="overlay-title">Round Over</h1>
          <p class="overlay-subtitle" id="gameover-subtitle">You got 0 of 10.</p>
          <p class="gameover-quip" id="points-line" hidden></p>
          <!-- Daily runs post to the day's board -->
          <div id="lb-entry" class="lb-entry hidden">
            <p class="lb-entry-msg">🗓 Post today's challenge score!</p>
            <div class="lb-entry-row">
              <input id="lb-name" class="lb-input" type="text" maxlength="12" placeholder="Your name" autocomplete="off" />
              <button id="lb-save-btn" class="btn" type="button">Save</button>
            </div>
          </div>
          <p id="lb-done" class="lb-entry-msg lb-done hidden">✓ Saved! See today's board on the hub.</p>
          <div class="gameover-actions">
            <button id="play-again-btn" class="btn" type="button">Play Again</button>
            <a class="btn btn-secondary" href="index.html">Done</a>
          </div>
          <div class="more-games">
            <span>More games:</span>
            <a href="topping-drop.html">Topping Drop</a>
            <a href="poke-slice.html">Poke Slice</a>
            <a href="word-bowl.html">Word Bowl</a>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="transitions.js?v=4"></script>
  <script src="supabase-config.js?v=2"></script>
  <script src="achievements.js?v=13"></script>
  <script src="daily.js?v=7"></script>
  <script src="track.js?v=1"></script>
  <script src="boost.js?v=2"></script>
  <script src="points.js?v=2"></script>
  <script src="challenges.js?v=11"></script>
  <script src="wordfilter.js?v=1"></script>
  <script src="arcade-sfx.js?v=1"></script>
  <script src="poke-iq.js?v=1"></script>
  <script src="back-guard.js?v=1"></script>
  <script src="pwa.js?v=1"></script>
</body>
</html>
