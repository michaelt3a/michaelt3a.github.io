<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Topping Drop - Pokeworks</title>
  <meta name="description" content="Catch the good toppings, dodge the rest." />
  <link rel="stylesheet" href="styles.css?v=22" />
  <link rel="stylesheet" href="theme.css?v=8" />
  <meta name="theme-color" content="#0a1010" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <script src="theme.js?v=6"></script>
  <script src="sound.js?v=3"></script>
  <script src="streak.js?v=1"></script>
</head>
<body>
  <a href="index.html" class="back-link">← Minigames</a>

  <div class="game-shell page-content">
    <header class="hud">
      <div class="hud-left">
        <img src="pokeworks-logo-circle-1.png" alt="Pokeworks" class="logo" />
      </div>
      <div class="hud-right">
        <div class="score">
          <span class="score-label">Best</span>
          <span id="high-score" class="score-value">0</span>
        </div>
        <div class="score">
          <span class="score-label">Score</span>
          <span id="score" class="score-value">0</span>
        </div>
      </div>
    </header>

    <main class="stage">
      <canvas id="game" class="game-canvas" width="800" height="600"></canvas>

      <div id="overlay" class="overlay">
        <div id="screen-start" class="overlay-panel">
          <h1 class="overlay-title">Topping Drop</h1>
          <p class="overlay-subtitle">
            Slide the bowl to catch the good stuff. Dropping food or catching
            forks and rogue chilis costs a heart; three hearts per shift.
            Stray hearts fall when you're hurt, catch them to heal up.
          </p>
          <button id="start-btn" class="btn" type="button">Start</button>
        </div>

        <div id="screen-gameover" class="overlay-panel hidden">
          <h1 class="overlay-title">Shift Over!</h1>
          <p class="overlay-subtitle" id="gameover-subtitle">You caught 0 toppings.</p>
          <p class="gameover-quip" id="points-line" hidden></p>
          <div class="gameover-actions">
            <button id="play-again-btn" class="btn" type="button">Play Again</button>
            <a class="btn btn-secondary" href="index.html">Done</a>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="transitions.js?v=4"></script>
  <script src="track.js?v=1"></script>
  <script src="boost.js?v=1"></script>
  <script src="points.js?v=2"></script>
  <script src="topping-drop.js?v=3"></script>
  <script src="back-guard.js?v=1"></script>
  <script src="pwa.js?v=1"></script>
</body>
</html>
