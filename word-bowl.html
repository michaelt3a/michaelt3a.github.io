<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Word Bowl - Pokeworks</title>
  <meta name="description" content="Guess the day's 5-letter word. New word daily, points for the Rewards Shop." />
  <link rel="stylesheet" href="styles.css?v=19" />
  <link rel="stylesheet" href="word-bowl.css?v=4" />
  <link rel="stylesheet" href="theme.css?v=8" />
  <meta name="theme-color" content="#0a1010" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <script src="theme.js?v=7"></script>
  <script src="sound.js?v=4"></script>
  <script src="streak.js?v=2"></script>
</head>
<body>
  <a href="index.html" class="back-link">← Minigames</a>

  <div class="game-shell page-content">
    <header class="hud">
      <div class="hud-left">
        <img src="pokeworks-logo-circle-1.png" alt="Pokeworks" class="logo" />
      </div>
      <div class="hud-right">
        <div class="score">
          <span class="score-label">Solved</span>
          <span id="wb-solved" class="score-value">0</span>
        </div>
        <div class="score">
          <span class="score-label">Streak</span>
          <span id="wb-streak" class="score-value">0</span>
        </div>
      </div>
    </header>

    <main class="wb-stage">
      <p class="wb-status" id="wb-status">Guess the 5-letter word</p>
      <div class="wb-grid" id="wb-grid"></div>
      <div class="wb-keys" id="wb-keys"></div>
      <button id="wb-share" class="btn wb-share" type="button" hidden>Share your grid</button>
      <button id="wb-archive" class="btn wb-share" type="button" hidden>📚 Play an old word</button>

      <!-- Completion screen -->
      <div class="wb-overlay hidden" id="wb-end">
        <div class="wb-panel">
          <button class="wb-end-close" id="wb-end-close" type="button" aria-label="See the board">✕</button>
          <div class="wb-end-emoji" id="wb-end-emoji">🎉</div>
          <h2 class="wb-end-title" id="wb-end-title">Solved!</h2>
          <p class="wb-sub" id="wb-end-sub"></p>
          <div class="wb-end-stats">
            <div><strong id="wb-end-pts">+0</strong><small>points</small></div>
            <div><strong id="wb-end-solved">0</strong><small>solved</small></div>
            <div><strong id="wb-end-streak">0</strong><small>streak</small></div>
          </div>
          <button id="wb-end-share" class="btn" type="button">Share your grid</button>
          <a href="index.html" class="btn btn-secondary">Back to Minigames</a>
          <p class="wb-end-note">New word tomorrow.</p>
        </div>
      </div>

      <!-- Start overlay -->
      <div class="wb-overlay" id="wb-overlay">
        <div class="wb-panel">
          <h1 class="overlay-title">🥢 Word Bowl</h1>
          <p class="wb-sub" id="wb-sub">One word a day, six tries. Fewer guesses pay more points.</p>
          <div class="wb-legend">
            <span class="wb-tile demo good">A</span> right spot
            <span class="wb-tile demo near">B</span> wrong spot
            <span class="wb-tile demo miss">C</span> not in it
          </div>
          <label class="wb-hard"><input type="checkbox" id="wb-hard-check" /> Hard mode: every hint must be reused (+15 pts)</label>
          <button id="wb-start" class="btn" type="button">Play</button>
        </div>
      </div>
    </main>
  </div>

  <script src="transitions.js?v=4"></script>
  <script src="supabase-config.js?v=2"></script>
  <script src="achievements.js?v=10"></script>
  <script src="daily.js?v=6"></script>
  <script src="boost.js?v=1"></script>
  <script src="track.js?v=1"></script>
  <script src="points.js?v=2"></script>
  <script src="mail-sync.js?v=2"></script>
  <script src="challenges.js?v=7"></script>
  <script src="word-bowl-dict.js?v=1"></script>
  <script src="word-bowl.js?v=7"></script>
  <script src="pwa.js?v=1"></script>
</body>
</html>
